<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamoja Wealth Circle - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0b0f;
            color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background-color: #16161e;
            border: 1px solid #2d2d3d;
        }
        .text-gold {
            color: #ffc107;
        }
        /* Make form labels and text clearly visible and bright against dark background */
        .form-label {
            color: #e9ecef !important;
            font-weight: 500;
        }
        .form-control {
            background-color: #21212b !important;
            color: #ffffff !important;
            border: 1px solid #495057 !important;
        }
        .form-control::placeholder {
            color: #adb5bd !important;
            opacity: 1;
        }
        .form-control:focus {
            background-color: #21212b !important;
            color: #ffffff !important;
            border-color: #ffc107 !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
        }
        .btn-purple {
            background-color: #6f42c1;
            color: white;
        }
        .btn-purple:hover {
            background-color: #5a3298;
            color: white;
        }
        .form-check-input {
            background-color: #21212b;
            border-color: #495057;
        }
        .form-check-input:checked {
            background-color: #6f42c1;
            border-color: #6f42c1;
        }
        .form-check-label {
            color: #ced4da;
        }
    </style>
</head>
<body>

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-5">
        
        <div class="text-center mb-4">
            <h1 class="fw-bold text-gold">Pamoja Wealth Circle</h1>
            <p class="text-muted">Secure Chama Contribution & Payout Rotation Platform</p>
        </div>

        <div class="row w-100 justify-content-center">
            <!-- Login Form Card -->
            <div class="col-md-5">
                <div class="card p-4 shadow-lg">
                    <h3 class="text-gold mb-3 text-center">Member Login</h3>

                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" placeholder="Enter your username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="passwordField" name="password" placeholder="Enter your password" required>
                        </div>
                        
                        <!-- Show Password Checkbox Option -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="showPasswordCheck" onclick="togglePasswordVisibility()">
                            <label class="form-check-label" for="showPasswordCheck">Show Password</label>
                        </div>

                        <button type="submit" class="btn btn-purple w-100 py-2 fw-bold">Login to Dashboard</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Toggle Password Script -->
    <script>
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('passwordField');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
